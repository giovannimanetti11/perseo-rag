services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: perseo_rag
      POSTGRES_USER: perseo
      POSTGRES_PASSWORD: perseo
    ports:
      # Development database only: never expose the known dev credentials on the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perseo -d perseo_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-perseo.sql:ro
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
